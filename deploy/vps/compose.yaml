name: fundpilot
services:
  web:
    build:
      context: ../..
      dockerfile: Dockerfile
    user: "10001:10001"
    # Linux VPS: host Caddy and the backend really communicate over loopback.
    # Publishing a Docker bridge port would make the peer a bridge gateway IP.
    network_mode: host
    env_file: .env
    environment:
      PORT: "8080"
      FUNDPILOT_BIND_HOST: "127.0.0.1"
      FUNDPILOT_STATE_DIR: /app/data/cloud
    volumes:
      - /var/lib/fundpilot/data:/app/data
    restart: unless-stopped
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
