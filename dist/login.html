<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>登录 · FundPilot AI</title><link rel="stylesheet" href="login.css?v=20261102-phone1"><script src="phone-verification.js?v=20261102-phone1" defer></script><script src="login.js?v=20261102-phone1" defer></script></head>
<body><main class="login-shell">
  <section class="login-intro"><a class="brand" href="/index.html"><span class="logo">FP</span>FundPilot AI</a><span class="eyebrow">YOUR RESEARCH WORKSPACE</span><h1>看清证据，<br>专注有价值的研究。</h1><p>共享市场洞察，保留自己的关注与思考。</p><div class="features"><span>01　共用板块研究报告</span><span>02　个人关注列表</span><span>03　独立研究记录</span></div></section>
  <section class="login-card" aria-labelledby="formTitle"><span class="eyebrow">WELCOME</span><h2 id="formTitle">登录研究工作台</h2><p id="formIntro">正在连接账号服务…</p>
    <div id="loginMethods" class="login-methods" role="group" aria-label="登录方式" hidden><button id="passwordMethod" type="button" aria-pressed="true">账号密码</button><button id="smsMethod" type="button" aria-pressed="false" disabled>短信验证码</button></div>
    <p id="phoneNotice" class="phone-notice" hidden></p>
    <form id="authForm">
      <fieldset id="credentials"><label for="username">用户名</label><input id="username" name="username" autocomplete="username" pattern="[A-Za-z0-9_]{3,32}" minlength="3" maxlength="32" required placeholder="3～32 位字母、数字或下划线"><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" minlength="12" maxlength="128" required placeholder="12～128 个字符"><div id="confirmField" hidden><label for="confirm">确认密码</label><input id="confirm" type="password" autocomplete="new-password" maxlength="128"></div></fieldset>
      <fieldset id="phoneFields" hidden><legend id="phoneLegend">验证手机号</legend><label for="phone">手机号</label><div class="phone-number"><span aria-hidden="true">+86</span><input id="phone" type="tel" inputmode="tel" autocomplete="tel-national" maxlength="11" pattern="1[3-9][0-9]{9}" aria-describedby="phoneHelp" placeholder="中国大陆 11 位手机号"></div><label for="smsCode">短信验证码</label><div class="sms-code-row"><input id="smsCode" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="6 位验证码"><button id="sendCode" type="button" disabled>获取验证码</button></div><p id="phoneHelp" class="field-help">验证码 5 分钟有效，请勿向他人透露。</p><p id="smsStatus" class="sms-status" role="status" aria-live="polite"></p></fieldset>
      <div id="setupField" hidden><label for="setupToken">初始化口令</label><input id="setupToken" type="password" autocomplete="off" maxlength="512"><p>由网站所有者在托管平台设置，仅首次创建管理员使用。</p></div>
      <p id="authStatus" role="status" aria-live="polite"></p><button id="submitAuth" type="submit" disabled>登录</button>
    </form>
    <button class="switch" id="switchMode" type="button" hidden>注册新账号</button><a class="login-service-link" href="ai-service.html">了解 AI 自动化研究 · QQ 客服订阅 ↗</a><p class="privacy">研究报告供比较证据与复盘使用。密码经加盐哈希保存，绑定手机号仅向您展示脱敏信息。</p>
  </section>
</main></body></html>
