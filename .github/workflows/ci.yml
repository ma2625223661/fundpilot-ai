# Runs the checks a change must pass before merging (see CLAUDE.md): the new
# frontend's tests, UI rules and build, and the backend and old-frontend tests.
# Tests use mocked sources; nothing here calls a paid AI service or sends SMS.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 前端（web/）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run check:ui
      - run: npm run build

  backend:
    name: 后端与旧版网页测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Same as the Docker image (Dockerfile).
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-cloud.txt
      - name: 后端测试
        env:
          TZ: Asia/Shanghai
        run: python -B tests/run_backend.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 旧版网页测试
        run: node --test "tests/legacy-frontend/*.cjs"
